<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F7F7" />
    <title>Hors ligne — tree</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #171717; background: #f7f7f7; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 440px); text-align: center; }
      img { width: 72px; height: 72px; margin-bottom: 24px; }
      h1 { margin: 0 0 12px; font-size: clamp(1.75rem, 7vw, 2.5rem); letter-spacing: -.04em; }
      p { margin: 0 auto 28px; max-width: 34ch; color: #666; line-height: 1.65; }
      button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 999px; background: #111; color: white; font: inherit; font-weight: 600; cursor: pointer; }
      button:focus-visible { outline: 3px solid #f0805f; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/tree.svg" alt="" />
      <h1>Vous êtes hors ligne</h1>
      <p>Reconnectez-vous à Internet pour retrouver vos arbres et synchroniser vos modifications.</p>
      <button type="button" onclick="window.location.reload()">Réessayer</button>
    </main>
  </body>
</html>
