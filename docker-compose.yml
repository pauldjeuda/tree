# Production : base MySQL + backend + site (nginx). Lancer avec :
#   cp .env.example .env     (puis éditer .env)
#   docker compose up -d --build
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-tree_db}
      MYSQL_USER: ${DB_USER:-tree_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Définissez DB_PASSWORD dans .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Définissez DB_ROOT_PASSWORD dans .env}
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_DIALECT: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-tree_db}
      DB_USER: ${DB_USER:-tree_user}
      DB_PASSWORD: ${DB_PASSWORD}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?Définissez PUBLIC_APP_URL dans .env}
      CORS_ORIGIN: ${PUBLIC_APP_URL}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      UPLOAD_DIR: /app/uploads
      AUTO_MIGRATE: 'false' # les migrations sont lancées par la commande du conteneur
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:4000
    ports:
      - '${HTTP_PORT:-80}:80'

volumes:
  db_data:
  uploads:
